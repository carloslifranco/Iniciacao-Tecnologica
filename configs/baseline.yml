experiment:
  name: fashion_mnist_models
  seed: 42

data:
  dataset: fashion_mnist
  image_size: 28
  channels: 1
  samples: 60000

training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.0002

models:
  vae:
    learning_rate: 0.001
    latent_dim: 20
    samples: 64
  gan:
    learning_rate: 0.0002
    latent_dim: 64
    samples: 64
  pixelcnn:
    learning_rate: 0.001
    hidden_channels: 64
    samples: 8
  normalizing_flow:
    learning_rate: 0.0005
    hidden_dim: 512
    coupling_layers: 6
    samples: 64
  diffusion:
    learning_rate: 0.0002
    timesteps: 200
    channels: 64
    samples: 16
    clip_denoised: true  # limita x0 a [-1, 1] na geração; evita imagens saturadas
  conditional_diffusion:
    learning_rate: 0.0002
    timesteps: 200
    channels: 64
    samples: 8           # imagens por classe nas amostras de cada época
    label_dropout: 0.1   # fração do treino sem classe (classifier-free guidance)
    guidance_scale: 3.0  # 1 = sem guidance; maior = classe mais evidente
    clip_denoised: true  # limita x0 a [-1, 1] na geração; evita imagens saturadas
  latent_diffusion:
    learning_rate: 0.0002
    autoencoder_learning_rate: 0.001
    autoencoder_epochs: 10
    latent_channels: 4
    timesteps: 100
    channels: 32
    samples: 16
